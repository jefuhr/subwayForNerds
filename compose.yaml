services:
  subway:
    build:
      context: .
      args:
        APP_BASE: /subwaysForNerds/
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - subway-state:/app/state
    environment:
      APP_BASE: /subwaysForNerds/
      SFN_AUTH_ENABLED: ${SFN_AUTH_ENABLED:-false}
      SFN_AUTH_ORIGIN: ${SFN_AUTH_ORIGIN:-https://juliet.nyc}
      SFN_ACCOUNT_ENCRYPTION_KEY: ${SFN_ACCOUNT_ENCRYPTION_KEY:-}
      SFN_APPLE_APP_ID: ${SFN_APPLE_APP_ID:-}
      SFN_APPLE_SERVICES_ID: ${SFN_APPLE_SERVICES_ID:-}
      SFN_APPLE_TEAM_ID: ${SFN_APPLE_TEAM_ID:-}
      SFN_APPLE_KEY_ID: ${SFN_APPLE_KEY_ID:-}
      SFN_APPLE_PRIVATE_KEY: ${SFN_APPLE_PRIVATE_KEY:-}
      SFN_GOOGLE_IOS_CLIENT_ID: ${SFN_GOOGLE_IOS_CLIENT_ID:-}
      SFN_GOOGLE_WEB_CLIENT_ID: ${SFN_GOOGLE_WEB_CLIENT_ID:-}
      SFN_GOOGLE_CLIENT_SECRET: ${SFN_GOOGLE_CLIENT_SECRET:-}
      SFN_TRUST_PROXY: ${SFN_TRUST_PROXY:-}
volumes:
  subway-state:
