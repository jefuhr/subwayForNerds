# Include inside juliet.nyc's existing HTTPS server block.
# Preserve the prefix upstream. This application owns no root-level asset/API paths.
location = /subwaysForNerds {
    return 308 /subwaysForNerds/$is_args$args;
}
location /subwaysForNerds/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 15s;
}

# OAuth callbacks contain authorization codes. Do not log their query strings.
location ^~ /subwaysForNerds/api/v1/auth/ {
    access_log off;
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
}
